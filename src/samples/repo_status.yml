# ============================================================================
# SAMPLE: repo_status.yml — repo_manager output contract
# ============================================================================
# Location (NFS):
#   /opt/omnia/output/repo_manager/repo_status.yml
#
# Producer: repo_manager domain (repo_manager.yml)
# Consumer: image_build_manager domain (image_build_manager.yml Step 4)
#
# image_build_manager pre-check validates:
#   1. File exists at repo_manager_output path
#   2. overall_status == "success"
#   3. rpm_repos contains valid URLs for the target architectures
#   4. repo_manager section contains certificate and port
# ============================================================================

overall_status: success

# OS metadata — tells image_build_manager the build target OS
cluster_os_type: "rhel"
cluster_os_version: "10.0"

# Repo sync status
repo_config: "partial"

# repo_manager connection details
repo_manager:
  port: 2225
  certificates:
    server_crt: /opt/omnia/pulp/settings/certs/pulp_webserver.crt
    server_key: /opt/omnia/pulp/settings/certs/pulp_webserver.key
    certs_dir: /opt/omnia/pulp/settings/certs

# RPM Repository Base URLs (keyed by architecture)
rpm_repos:
  x86_64:
    repo_manager_additional: https://{{ admin_nic_ip }}:2225/pulp/content/offline_repo/cluster/x86_64/rhel/10.0/rpms/x86_64_rhel_10.0_repo_manager-additional/
