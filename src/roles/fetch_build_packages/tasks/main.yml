---
# ==========================================================================
# Standalone mode: Load packages from functional_group_packages.yml
# ==========================================================================
# Replaces the Mode C chain of:
#   metadata_file_path → software_config.json → config/<arch>/*.json
#   → base_image_package_collector → image_package_collector
# with a single flat mapping file.

- name: Load functional group package mapping (standalone)
  when: standalone_mode | default(false) | bool
  block:
    - name: Load functional_group_packages.yml
      ansible.builtin.include_vars:
        file: "{{ _resolved_repo_output }}/functional_group_packages.yml"
        name: _fg_pkg_mapping

    - name: Set base_image_packages from mapping
      ansible.builtin.set_fact:
        base_image_packages: "{{ _fg_pkg_mapping.base_packages | default([]) }}"
        cacheable: true

    - name: Build compute_images_dict from mapping + enabled functional_groups
      ansible.builtin.set_fact:
        compute_images_dict: >-
          {% set result = {} -%}
          {% for fg in functional_groups -%}
            {% set fg_name = fg.name if fg is mapping else fg -%}
            {% if fg_name.endswith('_' + build_arch) -%}
              {% set pkgs = (_fg_pkg_mapping.functional_groups[fg_name].packages | default([])) -%}
              {% set _ = result.update({fg_name: {'functional_group': fg_name, 'packages': pkgs}}) -%}
            {% endif -%}
          {% endfor -%}
          {{ result }}
        cacheable: true

    - name: Set cluster OS version from repo_status
      ansible.builtin.set_fact:
        rhel_tag: "{{ hostvars['localhost']['cluster_os_version'] | default(cluster_os_version | default('10.0')) }}"

    - name: Set service_k8s_version (empty unless overridden)
      ansible.builtin.set_fact:
        service_k8s_version: ""
        cacheable: true

    - name: Debug standalone package resolution
      ansible.builtin.debug:
        msg: "Standalone: {{ compute_images_dict | length }} functional groups, {{ base_image_packages | length }} base packages"
        verbosity: 1

- name: Fetch pulp endpoint repos
  ansible.builtin.include_tasks: fetch_pulp_repos.yml
  when: standalone_mode | default(false) | bool

