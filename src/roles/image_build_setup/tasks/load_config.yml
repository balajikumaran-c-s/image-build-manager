---
# Step 2: Load and validate config.yml
# Step 3: Set project dirs and host vars
#
# Loads config.yml from repo root, validates all host fields,
# sets derived paths, and creates runtime directories.

# --- Load config.yml ---
- name: Check for config.yml
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../config.yml"
  register: _config_file

- name: Fail if config.yml not found
  ansible.builtin.fail:
    msg: "{{ config_missing_fail_msg }}"
  when: not _config_file.stat.exists

- name: Load config.yml
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../config.yml"
    name: standalone_config

# --- Validate structure ---
- name: Validate config.yml structure
  ansible.builtin.assert:
    that:
      - standalone_config.project_name is defined
      - standalone_config.project_name | length > 0
      - standalone_config.host is defined
      - standalone_config.host.hostname is defined
      - standalone_config.host.admin_nic_ip is defined
      - standalone_config.host.shared_path is defined
      - standalone_config.host.domain_name is defined
    fail_msg: "{{ config_validation_fail_msg }}"
    quiet: true

# --- Validate host fields ---
- name: Validate host.hostname format
  ansible.builtin.assert:
    that:
      - standalone_config.host.hostname | length > 0
      - standalone_config.host.hostname is regex('^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$')
    fail_msg: "{{ host_hostname_fail_msg }}"
    quiet: true

- name: Validate host.admin_nic_ip is a valid IPv4 address
  ansible.builtin.assert:
    that:
      - standalone_config.host.admin_nic_ip | ansible.utils.ipaddr('ipv4')
    fail_msg: "{{ host_admin_nic_ip_fail_msg }}"
    quiet: true

- name: Validate host.shared_path is an absolute path
  ansible.builtin.assert:
    that:
      - standalone_config.host.shared_path | length > 0
      - standalone_config.host.shared_path is regex('^/')
    fail_msg: "{{ host_shared_path_fail_msg }}"
    quiet: true

- name: Validate host.domain_name is not empty
  ansible.builtin.assert:
    that:
      - standalone_config.host.domain_name | length > 0
    fail_msg: "{{ host_domain_name_fail_msg }}"
    quiet: true

# --- Set project dirs and host vars ---
- name: Set project dirs from config
  ansible.builtin.set_fact:
    input_project_dir: "{{ playbook_dir }}/input/{{ standalone_config.project_name }}"
    output_project_dir: "{{ standalone_config.host.shared_path }}/output/{{ standalone_config.project_name }}"
    log_dir: "{{ standalone_config.host.shared_path }}/log/{{ standalone_config.project_name }}"
    project_name: "{{ standalone_config.project_name }}"
    admin_nic_ip: "{{ standalone_config.host.admin_nic_ip }}"
    shared_path: "{{ standalone_config.host.shared_path }}"
    host_name: "{{ standalone_config.host.hostname }}"
    domain_name: "{{ standalone_config.host.domain_name }}"
    functional_groups_config_path: "{{ standalone_config.host.shared_path }}/output/{{ standalone_config.project_name }}/.data/functional_groups_config.yml"
    standalone_mode: true
    cacheable: true

- name: Verify project input directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: _project_dir_check

- name: Fail if project input directory does not exist
  ansible.builtin.fail:
    msg: "{{ project_dir_not_exist_fail_msg }}"
  when: not _project_dir_check.stat.exists

# --- Create runtime directories ---
- name: Ensure shared_path directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ shared_path }}"
    - "{{ output_project_dir }}"
    - "{{ log_dir }}"
  become: true
