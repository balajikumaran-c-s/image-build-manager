---
# Step 4: Validate all prerequisite files (fail-fast)
#
# Loads image_build_config.yml to discover repo_manager_output_dir,
# then checks that all required files exist before proceeding.

- name: Load image_build_config.yml to get repo_manager_output_dir
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/image_build_config.yml"

- name: Stat all prerequisite files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ input_project_dir }}/image_build_config.yml"
    - "{{ repo_manager_output_dir }}"
    - "{{ repo_manager_output_dir }}/repo_status.yml"
    - "{{ repo_manager_output_dir }}/functional_group_packages.yml"
  register: _prereq_checks

- name: Fail if image_build_config.yml not found
  ansible.builtin.fail:
    msg: "{{ image_build_config_not_found_fail_msg }}"
  when: not _prereq_checks.results[0].stat.exists

- name: Fail if repo_manager output directory not found
  ansible.builtin.fail:
    msg: "{{ repo_manager_output_dir_fail_msg }}"
  when: not _prereq_checks.results[1].stat.exists

- name: Fail if repo_status.yml not found
  ansible.builtin.fail:
    msg: "{{ repo_status_not_found_fail_msg }}"
  when: not _prereq_checks.results[2].stat.exists

- name: Fail if functional_group_packages.yml not found
  ansible.builtin.fail:
    msg: "{{ functional_group_packages_not_found_fail_msg }}"
  when: not _prereq_checks.results[3].stat.exists
